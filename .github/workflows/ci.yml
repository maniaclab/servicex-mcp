name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  # Many color libraries just need this to be set to any value, but at least
  # one distinguishes color depth, where "3" -> "256-bit color".
  FORCE_COLOR: 3

jobs:
  pre-commit:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.68.1
          cache: true
          cache-key: dev-helm
          cache-write:
            ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          environments: dev helm

      - name: Run pre-commit
        run: pixi run pre-commit --stage manual

      - name: Run PyLint
        run: pixi run pylint --output-format=github

      - name: Run helm lint
        run: pixi run helm-lint

      # helm lint does not propagate a `fail()` raised from inside a template
      # (e.g. the chart's required auth.backendUrl check, invoked via
      # `include` inside the Deployment's container args) as a lint error --
      # it only logs it at INFO level and still exits 0. helm template does
      # error on that path, so it's the step that actually exercises the
      # serve-args construction an operator would hit first.
      - name: Run helm template
        run: pixi run helm-template

  checks:
    name: Check Python ${{ matrix.python-version }} on ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    needs: [pre-commit]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Mirrors pixi.toml's [environments]: py311-py313 only (no py314
        # environment defined yet, unlike rucio-mcp). windows-latest is not
        # tested -- untested here, not confirmed broken. py310 dropped:
        # af-credentials' published conda-forge build requires python>=3.11
        # (maniaclab/af-credentials#9 / broker-mode support), so this
        # project's floor moved to 3.11 in lockstep (pyproject.toml too).
        python-version: ["3.11", "3.12", "3.13"]
        runs-on: [ubuntu-latest, macos-14]
        include:
          - python-version: "3.11"
            pixi-environment: py311
          - python-version: "3.12"
            pixi-environment: py312
          - python-version: "3.13"
            pixi-environment: py313

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.68.1
          cache: true
          cache-key: ${{ matrix.pixi-environment }}-${{ github.ref_name }}
          cache-write:
            ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          environments: ${{ matrix.pixi-environment }}

      # test-all runs `pytest --cov=servicex_mcp` without --runslow, so
      # tests/integration/test_live.py (marked `slow`) is collected but
      # auto-skipped here -- it needs a real .servicex/servicex.yaml with a
      # live backend and an unexpired refresh token, and there is no CI
      # secret wired up for that yet. Setting up live-credential CI for that
      # suite is deferred to Giordon; do not add ServiceX secrets/credentials
      # to this workflow without his explicit go-ahead.
      - name: Test package
        run: >-
          pixi run -e "$PIXI_ENVIRONMENT" test-all -ra --cov-branch
          --cov-report=xml --cov-report=term --junitxml=junit.xml -o
          junit_family=legacy --durations=20
        env:
          PIXI_ENVIRONMENT: ${{ matrix.pixi-environment }}

      # - name: Test docstrings
      #   if: matrix.python-version == '3.13'
      #   run: pixi run -e ${{ matrix.pixi-environment }} test-docstrings

      - name: Upload coverage report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
