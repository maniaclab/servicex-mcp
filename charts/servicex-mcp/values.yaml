# Default values for servicex-mcp.
# This chart deploys servicex-mcp over HTTP transport, in one of two modes
# (see auth.brokerUrl below):
#   - standalone/bridge mode (default, auth.brokerUrl empty): backed by the
#     CIMD OAuth bridge -- each user pastes their own ServiceX personal
#     refresh token through the server's /bridge interstitial the first time
#     they connect. The server holds no ServiceX credential of its own.
#     Needs a public Ingress.
#   - broker mode (auth.brokerUrl set): the server registers no OAuth 2.1
#     authorization server of its own and instead redeems ServiceX access
#     tokens from an AF MCP broker (maniaclab/af-mcp-platform) per call, via
#     POST {auth.brokerUrl}/v1/credentials/servicex/redeem. Callers
#     authenticate with an AF Broker Identity Token, not a ServiceX personal
#     refresh token. No public Ingress needed -- set ingress.enabled: false
#     and auth.resourceUrl explicitly to your own in-cluster Service URL
#     (there is no public hostname to derive it from in this mode).

# -- Container image. There is no published servicex-mcp image; the chart runs
# the prefix-dev pixi image and installs servicex-mcp at pod startup (see
# initContainer).
image:
  repository: ghcr.io/prefix-dev/pixi
  tag: "0.69.0-jammy"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# -- servicex-mcp release pinned into the rendered pixi.toml at /workspace.
servicexMcp:
  # Conda-forge version of servicex-mcp to install (==<version>). Placeholder
  # until the first release is published to conda-forge.
  version: "0.1.2"
  # Extra conda-forge dependencies merged into the rendered pixi.toml, as a
  # name -> version-spec map.
  extraPixiDependencies: {}
  # Frozen pixi.lock content for reproducible installs. Empty by default (a
  # release must exist before it can be locked). Supply with, e.g.:
  #   helm install ... --set-file servicexMcp.pixiLockContent=pixi.lock
  # When set, the lock is mounted alongside pixi.toml and pixi installs from it.
  pixiLockContent: ""

replicaCount: 1

# -- Disable all write tools (recommended for shared/hosted deployments).
readOnly: true

# -- servicex-mcp log level: debug | info | warning | error.
logLevel: info

server:
  # Bind address inside the pod.
  host: "0.0.0.0"
  # Container port for the MCP HTTP endpoint.
  port: 9000
  # Directory (inside the pod) servicex-mcp caches downloaded query results in.
  cacheDir: /tmp/servicex_mcp_cache

# The two URLs HTTP transport requires (see `servicex-mcp serve --help`):
auth:
  # Base URL of the ServiceX deployment this server talks to (required).
  backendUrl: ""
  # Public URL clients reach this server at; used to build the DNS-rebinding
  # protection allow-list (and, in bridge mode, OAuth redirect URIs). If
  # empty, derived as https://<ingress.host> -- which only works when
  # ingress.host is actually set, so broker-mode deployments (no Ingress)
  # must set this explicitly.
  resourceUrl: ""
  # Base URL of an AF MCP broker (maniaclab/af-mcp-platform), e.g.
  # "http://af-mcp-platform-broker.mcp.svc.cluster.local:8080". Empty
  # (default): standalone/bridge mode. Set: broker mode -- passed through
  # verbatim as `servicex-mcp serve --broker-url`.
  brokerUrl: ""

# -- Extra environment variables for the main container (free-form list of
# corev1.EnvVar).
extraEnv: []

ingress:
  enabled: true
  className: nginx
  # External hostname. Also used to derive auth.resourceUrl when that's empty.
  host: ""
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true
    # TLS Secret name. Defaults to <fullname>-tls when empty.
    secretName: ""

service:
  type: ClusterIP
  # External service port mapped to server.port.
  port: 80

serviceAccount:
  create: false
  name: ""
  annotations: {}

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 2Gi

# Resources for the pixi-install init container (install is the heavy step).
initResources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

# -- Pod-level securityContext (rendered as-is via toYaml). Empty by default;
# add fields like `fsGroup` here if your cluster requires them.
podSecurityContext: {}

# -- Container-level securityContext (rendered as-is via toYaml), applied to
# both the pixi-install init container and the main container. Defaults are
# safe no-ops for this workload: the init container runs `pixi install` and
# the main container runs `pixi shell-hook` against /workspace (an emptyDir),
# both of which currently expect to run as the image's default user (root) and
# may write outside /workspace (e.g. pixi/conda caches under $HOME). Do NOT
# default `runAsNonRoot: true` or `readOnlyRootFilesystem: true` without first
# verifying the pixi image + install flow tolerates them.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
  # Stricter options to consider once verified against your pixi image/setup:
  # runAsNonRoot: true
  # readOnlyRootFilesystem: true
