apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "servicex-mcp.fullname" . }}-pixi
  labels:
    {{- include "servicex-mcp.labels" . | nindent 4 }}
data:
  pixi.toml: |
    [workspace]
    channels = ["conda-forge"]
    name = "servicex-mcp"
    platforms = ["linux-64", "linux-aarch64"]
    version = "0.1.0"

    [dependencies]
    servicex-mcp = "=={{ .Values.servicexMcp.version }}"
    {{- range $name, $spec := .Values.servicexMcp.extraPixiDependencies }}
    {{ $name }} = "{{ $spec }}"
    {{- end }}
  {{- if .Values.servicexMcp.pixiLockContent }}
  pixi.lock: |
    {{- .Values.servicexMcp.pixiLockContent | nindent 4 }}
  {{- end }}
